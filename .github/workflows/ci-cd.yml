name: CI CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify modules and generate coverage
        run: mvn -B -Ddocker.skip=true verify

      - name: Publish JaCoCo HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-reports
          path: |
            transaction-api/target/site/jacoco/**
            fraud-processor/target/site/jacoco/**

      - name: Publish Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            transaction-api/target/surefire-reports/**
            fraud-processor/target/surefire-reports/**

      - name: Add coverage summary
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for module in ["transaction-api", "fraud-processor"]:
              csv_path = Path(module) / "target" / "site" / "jacoco" / "jacoco.csv"
              if not csv_path.exists():
                  continue
              with csv_path.open() as f:
                  reader = csv.DictReader(f)
                  covered = missed = 0
                  for row in reader:
                      covered += int(row["LINE_COVERED"])
                      missed += int(row["LINE_MISSED"])
              total = covered + missed
              pct = 0.0 if total == 0 else covered * 100.0 / total
              rows.append((module, covered, missed, pct))

          summary = Path("coverage-summary.md")
          with summary.open("w") as f:
              f.write("## Test Coverage\n\n")
              f.write("| Module | Covered Lines | Missed Lines | Line Coverage |\n")
              f.write("| --- | ---: | ---: | ---: |\n")
              for module, covered, missed, pct in rows:
                  f.write(f"| {module} | {covered} | {missed} | {pct:.2f}% |\n")
          PY
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.md

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - transaction-api
          - fraud-processor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build module jar
        run: mvn -B -Ddocker.skip=true -pl ${{ matrix.service }} -am package

      - name: Compute image coordinates
        id: image
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="${REGISTRY}/${OWNER_LC}/${REPO_LC}-${{ matrix.service }}"
          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-ack:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        env:
          ACK_KUBECONFIG_B64: ${{ secrets.ACK_KUBECONFIG_B64 }}
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${ACK_KUBECONFIG_B64}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl get namespace

      - name: Compute GHCR image names
        id: images
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          TAG="latest"
          echo "transaction_api=${REGISTRY}/${OWNER_LC}/${REPO_LC}-transaction-api:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "fraud_processor=${REGISTRY}/${OWNER_LC}/${REPO_LC}-fraud-processor:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/shared-configmap.yaml
          kubectl apply -f k8s/transaction-api-configmap.yaml
          kubectl apply -f k8s/fraud-processor-configmap.yaml
          kubectl apply -f k8s/transaction-api-deployment.yaml
          kubectl apply -f k8s/transaction-api-service.yaml
          kubectl apply -f k8s/transaction-api-hpa.yaml
          kubectl apply -f k8s/fraud-processor-deployment.yaml
          kubectl apply -f k8s/fraud-processor-hpa.yaml

      - name: Update deployment images
        run: |
          kubectl -n fraud-platform set image deployment/transaction-api transaction-api=${{ steps.images.outputs.transaction_api }}
          kubectl -n fraud-platform set image deployment/fraud-processor fraud-processor=${{ steps.images.outputs.fraud_processor }}

      - name: Wait for rollout
        run: |
          kubectl -n fraud-platform rollout status deployment/transaction-api --timeout=5m
          kubectl -n fraud-platform rollout status deployment/fraud-processor --timeout=5m
