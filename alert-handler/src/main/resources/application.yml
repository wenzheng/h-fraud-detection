spring:
  application:
    name: alert-handler

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
  json:
    enabled: true

app:
  mns:
    endpoint: ${MNS_ENDPOINT:http://your-account-id.mns.cn-hangzhou.aliyuncs.com/}
    alert-queue-name: ${MNS_ALERT_QUEUE_NAME:fraud-alerts}
    access-key-id: ${MNS_ACCESS_KEY_ID:replace-me}
    access-key-secret: ${MNS_ACCESS_KEY_SECRET:replace-me}
  consumer:
    poller-concurrency: ${ALERT_CONSUMER_POLLER_CONCURRENCY:2}
    batch-size: ${ALERT_CONSUMER_BATCH_SIZE:8}
    wait-seconds: ${ALERT_CONSUMER_WAIT_SECONDS:15}
  alert-routing:
    high-actions:
      - TELEGRAM
      - LOG
    medium-actions:
      - EMAIL
      - LOG
    low-actions:
      - LOG
