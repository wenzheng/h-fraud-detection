apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: fraud-platform
  labels:
    app: transaction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      containers:
        - name: transaction-api
          image: registry.cn-hangzhou.aliyuncs.com/your-namespace/transaction-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-platform-shared-config
            - configMapRef:
                name: transaction-api-config
            - secretRef:
                name: mns-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
