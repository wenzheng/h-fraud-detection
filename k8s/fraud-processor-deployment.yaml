apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-processor
  namespace: fraud-platform
  labels:
    app: fraud-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-processor
  template:
    metadata:
      labels:
        app: fraud-processor
    spec:
      imagePullSecrets:
        - name: acr-credentials
      containers:
        - name: fraud-processor
          image: registry.cn-hangzhou.aliyuncs.com/your-namespace/fraud-processor:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-platform-shared-config
            - configMapRef:
                name: fraud-processor-config
            - secretRef:
                name: mns-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
