apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-handler
  namespace: fraud-platform
  labels:
    app: alert-handler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-handler
  template:
    metadata:
      labels:
        app: alert-handler
    spec:
      imagePullSecrets:
        - name: acr-credentials
      containers:
        - name: alert-handler
          image: registry.cn-hangzhou.aliyuncs.com/your-namespace/alert-handler:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-platform-shared-config
            - configMapRef:
                name: alert-handler-config
            - secretRef:
                name: mns-credentials
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
